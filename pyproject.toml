[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talkie-evals"
version = "0.1.0"
description = "Reproducible CUDA/Modal evaluations for Talkie language models."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Max Ghenis" }
]
dependencies = [
  "modal==1.4.2",
]

[project.scripts]
talkie-evals = "talkie_evals.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "ruff==0.14.8",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

